[package]
name = "zmem"
repository = "https://github.com/xeome/zmem"
version = "0.2.3"
edition = "2021"
license = "GPL-3.0"
description = "Zmem is a Linux memory monitoring program that displays detailed information about virtual memory."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"

[profile.release]
lto = "thin"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# ponytail: dist no longer checks release.yml, so dependabot owns its action
# pins. Run `dist init` by hand when bumping cargo-dist-version.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "skip"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
